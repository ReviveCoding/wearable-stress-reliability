name: Temporary branch-only Ruff repair

on:
  push:
    branches:
      - maintenance/code-polish-config-seed-20261014

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Run safe automated Ruff fixes
        run: |
          python -m pip install ruff==0.17.0
          python -m ruff check --fix src tests scripts || true
          python -m ruff format src tests scripts
          git diff --check
      - name: Commit changes on temporary PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Apply safe Ruff repairs and formatting on PR branch'
            git push origin HEAD:refs/heads/maintenance/code-polish-config-seed-20261014
          fi
